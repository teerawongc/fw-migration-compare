name: Deploy to Cloudflare Workers

# push ขึ้น main → build + deploy อัตโนมัติ
# workflow_dispatch = กด Run เองได้จากแท็บ Actions โดยไม่ต้อง commit ใหม่
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# กัน deploy ชนกันเมื่อ push ติดๆ กัน — งานเก่าที่ยังค้างจะถูกยกเลิก
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      # build.py แปลง fw_policy_compare.html เป็น src/index.js
      # (src/index.js ไม่ได้ commit ไว้ — สร้างใหม่ทุกครั้งเพื่อไม่ให้ HTML กับ worker หลุด sync)
      - name: Build worker จาก HTML
        run: python build.py

      # ตรวจว่า JS ที่ฝังใน HTML ไม่มี syntax error ก่อน deploy
      # (ถ้าพังแล้วปล่อยขึ้น production ผู้ใช้จะเจอหน้าเปล่า ไม่มี error ให้เห็น)
      - name: ตรวจ syntax
        run: |
          node --input-type=module -e "
            import('./src/index.js').then(() => console.log('worker syntax OK'))
              .catch(e => { console.error(e); process.exit(1); });
          "

      # ตรวจ secret ก่อน deploy — ถ้าไม่มี wrangler จะฟ้องแบบกำกวมว่า "non-interactive
      # environment" ซึ่งอ่านแล้วนึกว่าเป็นปัญหา environment ทั้งที่จริงคือ secret ว่าง
      # ขั้นนี้บอกตรงๆ ว่าตัวไหนหาย (ไม่ print ค่า secret ออกมา แค่บอกว่ามี/ไม่มี)
      - name: ตรวจว่าตั้ง GitHub Secrets ครบ
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail=0
          if [ -z "$TOKEN" ]; then
            echo "::error::ไม่พบ secret 'CLOUDFLARE_API_TOKEN'"
            fail=1
          else
            echo "CLOUDFLARE_API_TOKEN  : พบแล้ว (ยาว ${#TOKEN} ตัวอักษร)"
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::ไม่พบ secret 'CLOUDFLARE_ACCOUNT_ID'"
            fail=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID : พบแล้ว (ยาว ${#ACCOUNT} ตัวอักษร)"
          fi
          if [ $fail -eq 1 ]; then
            echo ""
            echo "ตั้งที่: Settings > Secrets and variables > Actions"
            echo "  - ต้องอยู่แท็บ 'Secrets' ไม่ใช่ 'Variables'"
            echo "  - ต้องอยู่หัวข้อ 'Repository secrets' ไม่ใช่ 'Environment secrets'"
            echo "  - ชื่อต้องตรงเป๊ะ ตัวพิมพ์ใหญ่ทั้งหมด ไม่มีช่องว่างหน้า/หลัง"
            exit 1
          fi

      # เรียก wrangler ตรงๆ ไม่ผ่าน cloudflare/wrangler-action
      # เหตุผล: action ตัวนั้นลง wrangler เวอร์ชันของมันเองทับ (พบจริง: ลง 3.90.0
      # ทั้งที่ package-lock ล็อกไว้ 4.110.0) ทำให้ deploy พังโดยที่รันในเครื่องผ่าน
      # --no-install บังคับให้ใช้ตัวใน node_modules จาก npm ci เท่านั้น = เวอร์ชัน
      # เดียวกับที่รันบนเครื่องเป๊ะ ไม่มีเซอร์ไพรส์
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler --version
          npx --no-install wrangler deploy
